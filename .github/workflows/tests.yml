name: tests

on:
  push:
  pull_request:

jobs:
  current-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install PETAL2D and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install PETAL2D
        run: python -m pip install -e .
      - name: Accuracy validation
        run: python validation/run_accuracy_validation.py --quick --output /tmp/petal2d-accuracy.json
      - name: Angular-resolution validation
        run: python validation/run_angular_resolution_validation.py --quick --output /tmp/petal2d-angular.json
      - name: Adaptive-truncation validation
        run: python validation/run_truncation_validation.py --quick --output /tmp/petal2d-truncation.json

  oldest-supported-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install oldest supported dependencies
        run: >-
          python -m pip install
          numpy==1.23.5
          scipy==1.9.3
          matplotlib==3.6.3
          pytest==8.3.5
      - name: Install PETAL2D without dependency resolution
        run: python -m pip install -e . --no-deps
      - name: Run tests
        run: python -m pytest -v
      - name: Accuracy validation
        run: python validation/run_accuracy_validation.py --quick --output /tmp/petal2d-accuracy-oldest.json
      - name: Angular-resolution validation
        run: python validation/run_angular_resolution_validation.py --quick --output /tmp/petal2d-angular-oldest.json
      - name: Adaptive-truncation validation
        run: python validation/run_truncation_validation.py --quick --output /tmp/petal2d-truncation-oldest.json

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install release dependencies
        run: python -m pip install ".[release]"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
