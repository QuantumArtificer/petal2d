name: tests

on:
  push:
  pull_request:

jobs:
  current-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -v
      - run: python validation/run_validation.py --quick --output /tmp/petal2d-validation.json

  oldest-supported-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          numpy==1.23.5
          scipy==1.9.3
          matplotlib==3.6.3
          pytest==8.3.5
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -v
      - run: python validation/run_validation.py --quick --output /tmp/petal2d-validation-oldest.json

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[release]"
      - run: python -m build
      - run: python -m twine check dist/*
