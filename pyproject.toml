[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "petal2d"
dynamic = ["version"]
description = "Polar Expansion Toolkit for Atomic Orbitals and Localized Fields in 2D."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Alex Santacruz" },
  { name = "2DQMAT Research @ IF-UNAM" }
]
keywords = [
  "angular-harmonics",
  "polar-coordinates",
  "atomic-orbitals",
  "localized-fields",
  "two-dimensional",
  "angular-momentum",
  "spectral-analysis"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.6"
]

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = ["psutil>=5.9"]
release = ["build>=1.2", "twine>=5"]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
  "myst-parser>=3",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6"
]

[project.urls]
Homepage = "https://github.com/QuantumArtificer/petal2d"
Documentation = "https://quantumartificer.github.io/petal2d/"
Repository = "https://github.com/QuantumArtificer/petal2d"
Archive = "https://doi.org/10.5281/zenodo.22715741"
Issues = "https://github.com/QuantumArtificer/petal2d/issues"

[tool.setuptools.dynamic]
version = { attr = "petal2d._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
